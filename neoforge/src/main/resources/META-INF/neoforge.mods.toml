license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"

displayURL = "https://www.curseforge.com/minecraft/mc-mods/only-tp"
issueTrackerURL = "https://github.com/Huziyang520/Only-TP/issues"
logoFile = "assets/onlytp/textures/onlytp.png"
authors = "${mod_author}"
description = '''
[EN] Restrict players to TP-related commands only, or block all non-TP commands.
[CN] 限制玩家仅可使用与传送（TP）相关的指令，或禁止所有非 TP 指令。
'''

[[mixins]]
config = "onlytp.neoforge.mixins.json"
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "camelot"
type = "required"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "avalonbase"
type = "optional"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "cloth-config"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
# displayURL / issueTrackerURL / logoFile are mod-specific and MUST live in
# the [[mods]] table; placed at the top level NeoForge silently ignores them
# and the mod-list homepage button stays disabled.
displayURL = "https://www.curseforge.com/minecraft/mc-mods/only-tp"
issueTrackerURL = "https://github.com/Huziyang520/Only-TP/issues"
logoFile = "assets/onlytp/textures/onlytp.png"
authors = "${mod_author}"
description = '''${description}'''
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_loader_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
# AvalonBase 前置（支持库）
modId = "avalonbase"
type = "optional"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"
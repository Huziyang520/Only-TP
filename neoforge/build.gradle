plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev'
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly fileTree(project.file("../../../AvalonBase/${avalon_range}/fabric/build/devlibs")) {
        include "avalonbase-fabric-${avalon_range}-${avalon_version}-dev.jar"
    }

    implementation "com.camelot:camelot-neoforge-${mc_range_label}:${camelot_version}"
    jarJar "com.camelot:camelot-neoforge-${mc_range_label}:${camelot_version}"
}

configurations.configureEach {
    if (name.startsWith('neoFormRuntime')) {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.apache.logging.log4j') {
                details.useVersion('2.19.0')
            }
        }
    }
}

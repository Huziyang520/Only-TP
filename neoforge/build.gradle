plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_name}-neoforge-${minecraft_version}"
}

neoForge {
    version = neoforge_version

    // Automated decoration of Dependencies for Dev/Prod builds, and ModMaven publishing
    addModdingDependenciesTo(sourceSets.main)

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev'
        }
        server {
            server()
        }
    }
}

dependencies {
    // AvalonBase 前置支持库：运行时作为 mod 依赖，由 onlytp 的 neoforge.mods.toml 声明前置
    // 通配匹配任意版本，避免 AvalonBase 升级时需同步修改（依赖约束 >=1.0 由 toml 保证）
    implementation fileTree(project.file("../../../AvalonBase/1.21.11/neoforge/build/libs")) {
        include "avalonbase-neoforge-1.21.11-*.jar", "AvalonBase-neoforge-1.21.11-*.jar"
        exclude "*-sources.jar"
        exclude "*-javadoc.jar"
    }
    // nightconfig（TOML）：NeoForge 运行时自带，编译期显式声明以解析 common 的引用
    compileOnly group: 'com.electronwill.night-config', name: 'core', version: '3.6.4'
    compileOnly group: 'com.electronwill.night-config', name: 'toml', version: '3.6.4'
}
plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.7'
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

    compileOnly "com.camelot:camelot-common-${mc_range_label}:${camelot_version}"

    compileOnly fileTree(project.file('../../../AvalonBase/1.21-1.21.1/common/build/libs')) {
        include 'avalonbase-common-1.21-1.21.1-1.5.1.jar'
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

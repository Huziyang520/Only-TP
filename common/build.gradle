plugins {
    id 'multiloader-common'
}

// 1.20.X 里 1.20-1.20.1 的 common 走 loom（与 forge 模块的 FG6 配套），
// 1.20.2+ 走 ModDevGradle。由 target 的 compile_plugin 属性选择。
def useLoom = (findProperty('compile_plugin') ?: 'moddev') == 'loom'
if (useLoom) {
    apply plugin: 'fabric-loom'
} else {
    apply plugin: 'net.neoforged.moddev'
}

apply from: "${rootProject.projectDir.parentFile}/gradle/avalon-base.gradle"

if (!useLoom) {
    neoForge {
        neoFormVersion = neo_form_version
        def at = file('src/main/resources/META-INF/accesstransformer.cfg')
        if (at.exists()) {
            accessTransformers.from(at.absolutePath)
        }
    }
}

dependencies {
    if (useLoom) {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.layered {
            officialMojangMappings()
            if (project.hasProperty('parchment_version')) {
                parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
            }
        }
        modCompileOnly(files(resolveAvalonJar('fabric')))
    } else {
        compileOnly(files(resolveAvalonJar('fabric')))
    }
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly group: 'com.electronwill.night-config', name: 'core', version: '3.6.4'
    compileOnly group: 'com.electronwill.night-config', name: 'toml', version: '3.6.4'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

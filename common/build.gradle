plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    // nightconfig（TOML）：Common 仅编译期需要，运行时由 Forge/NeoForge（自带）与 Fabric（显式引入）提供
    compileOnly group: 'com.electronwill.night-config', name: 'core', version: '3.6.4'
    compileOnly group: 'com.electronwill.night-config', name: 'toml', version: '3.6.4'

    // AvalonBase 前置支持库（GUI 主题 / 平台抽象 / 网络框架）：编译期引用其 fabric dev jar（named 映射）
    // 固定文件名：build/libs 永久保留各旧版 jar（铁律不删），通配会把多个版本同时放进 classpath；
    // AvalonBase 升版时必须同步修改此处文件名。
    // 注：common 为 NeoForge moddev 模块，无 loom，只能用普通 compileOnly。
    // named 映射：loom 的 build/libs 是 intermediary 产物，common 为 moddev（official/parchment）编译，只能用 devlibs 的 dev jar。
    compileOnly fileTree(project.file("../../../AvalonBase/1.21.9-1.21.11/fabric/build/devlibs")) {
        include "avalonbase-fabric-1.21.11-1.5.1-dev.jar"
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

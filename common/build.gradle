plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

    compileOnly "com.camelot:camelot-common-${mc_range_label}:${camelot_version}"

    compileOnly fileTree(project.file("../../../AvalonBase/26.3/fabric/build/libs")) {
        include "avalonbase-fabric-26.3-1.5.1.jar"
        exclude "*sources*", "*javadoc*"
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

def targetOverlay = findProperty('target_overlay')
if (targetOverlay) {
    def overlayRoot = rootProject.file(targetOverlay)
    if (new File(overlayRoot, 'common/java').directory) {
        def mergedJava = layout.buildDirectory.dir('merged/java')
        def mergeJava = tasks.register('mergeTargetJava', Sync) {
            from('src/main/java')
            from(new File(overlayRoot, 'common/java')) {
                include '**/*.java'
            }
            into mergedJava

            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
        sourceSets.main.java.setSrcDirs([mergedJava])
        tasks.named('compileJava') { dependsOn mergeJava }
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
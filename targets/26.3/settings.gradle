pluginManagement {
    repositories {
        maven {
            // 阿里云镜像：Gradle 插件门户
            name = 'Aliyun Gradle Plugin Portal'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// 26.X 线的一个 target。common / fabric / neoforge 三个模块在仓库根，由所有 target 共享，
// 这里只做指向；每个 target 只声明自己的版本区间、依赖版本与可选源码覆盖。
rootProject.name = 'OnlyTP-26.3'
includeBuild('../../build-logic')
include 'common'
include 'fabric'
include 'neoforge'
project(':common').projectDir = file('../../common')
project(':fabric').projectDir = file('../../fabric')
project(':neoforge').projectDir = file('../../neoforge')

pluginManagement {
    repositories {
        maven {
            name = 'Aliyun Gradle Plugin Portal'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        gradlePluginPortal()
        mavenCentral()
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Sponge Snapshots'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// 1.20.X 线的一个 target。common / fabric 共享，加载器模块按区间不同：1.20-1.20.1 用 forge/，
// 其余用 neoforge/。源码差异走 targets/<t>/overlay/。
rootProject.name = 'OnlyTP-1.20.2-1.20.4'
includeBuild('../../build-logic')
include 'common'
include 'fabric'
include 'neoforge'
project(':common').projectDir = file('../../common')
project(':fabric').projectDir = file('../../fabric')
project(':neoforge').projectDir = file('../../neoforge')

# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# 版本号全线共用：同一分支内所有 target 一起改号。
# Project
version=1.6.3
group=com.onlytp.onlytpmod
java_version=21
# 产物字节码目标（见 build-logic/src/main/groovy/multiloader-common.gradle 的 --release 说明）
java_target_version=17

# Common
minecraft_version=1.20.4
mc_range_label=1.20.2-1.20.4
mod_name=Only TP
mod_author=Huziyang520
mod_id=onlytp
license=MIT
credits=
description=Restrict players to using only TP-related commands, or completely disable non-TP commands. \nIssues: https://github.com/Huziyang520/Only-TP/issues | https://issue.mengcai.online/
minecraft_version_range=[1.20.2, 1.20.5)
# NeoForm version used to remap the 'common' module for 1.20.4
neo_form_version=1.20.4-20240627.114801

# Fabric
fabric_version=0.97.3+1.20.4
fabric_loader_version=0.14.24

# Forge

# NeoForge
neoforge_version=20.4.251
neoforge_loader_version_range=[1,)


# 本 target 的构建差异
compile_plugin=moddev
modmenu_version=15.0.2

# target 专属源码/资源覆盖目录（相对 targets/<t>/），空 = 不覆盖。
target_overlay=

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

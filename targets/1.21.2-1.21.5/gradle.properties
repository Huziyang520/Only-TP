# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# 版本号全线共用：同一分支内所有 target 一起改号。
# Project
version=1.6.3-fix
group=com.onlytp.onlytpmod
java_version=21

# Common
minecraft_version=1.21.5
mc_range_label=1.21.2-1.21.5
mod_name=Only TP
mod_author=Huziyang520
mod_id=onlytp
license=MIT
credits=
description=Restrict players to using only TP-related commands, or completely disable non-TP commands. \nIssues: https://github.com/Huziyang520/Only-TP/issues | https://issue.mengcai.online/
minecraft_version_range=[1.21.2, 1.21.6)
# NeoForm version used to remap the 'common' module for 1.21.5
neo_form_version=1.21.5-20250325.162830

# Fabric
fabric_version=0.128.2+1.21.5
fabric_loader_version=0.16.9

# Forge

# NeoForge
neoforge_version=21.5.98
neoforge_loader_version_range=[4,)


# 本 target 的前置库与可选依赖（不同区间路径不同，故参数化）
avalon_dir=AvalonBase/
avalon_fabric_dev_jar=
avalon_fabric_jar=
avalon_neoforge_jar=
modmenu_version=

# target 专属源码/资源覆盖目录（相对 targets/<t>/），空 = 不覆盖。
target_overlay=

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

pluginManagement {
    repositories {
        maven {
            name = 'Aliyun Gradle Plugin Portal'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        gradlePluginPortal()
        mavenCentral()
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Sponge Snapshots'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'OnlyTP-1.20-1.20.1'
includeBuild('../../build-logic')
include 'common'
include 'fabric'
include 'forge'
project(':common').projectDir = file('../../common')
project(':fabric').projectDir = file('../../fabric')
project(':forge').projectDir = file('../../forge')

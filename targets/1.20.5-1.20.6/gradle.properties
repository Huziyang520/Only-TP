# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# 版本号全线共用：同一分支内所有 target 一起改号。
# Project
version=1.6.3
group=com.onlytp.onlytpmod
java_version=21

# Common
minecraft_version=1.20.6
mc_range_label=1.20.5-1.20.6
mod_name=Only TP
mod_author=Huziyang520
mod_id=onlytp
license=MIT
credits=
description=Restrict players to using only TP-related commands, or completely disable non-TP commands. \nIssues: https://github.com/Huziyang520/Only-TP/issues | https://issue.mengcai.online/
minecraft_version_range=[1.20.5, 1.21)
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10
# NeoForm version used to remap the 'common' module for 1.21.1
neo_form_version=1.20.6-20240627.102356

# Fabric
fabric_version=0.100.8+1.20.6
fabric_loader_version=0.16.9

# Forge

# NeoForge
neoforge_version=20.6.141
neoforge_loader_version_range=[4,)


# 本 target 的构建差异
compile_plugin=moddev
modmenu_version=15.0.2

# target 专属源码/资源覆盖目录（相对 targets/<t>/），空 = 不覆盖。
target_overlay=overlay

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

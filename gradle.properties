# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.5.0
group=com.onlytp.onlytpmod
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Only TP
mod_author=Huziyang520
mod_id=onlytp
license=MIT
credits=
description=Restrict players to using only TP-related commands, or completely disable non-TP commands. \nIssues: https://github.com/Huziyang520/Only-TP/issues | https://issue.mengcai.online/
minecraft_version_range=[26.1.2, 26.2)
# NeoForm version used to remap the 'common' module for 26.1.2
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.145.4+26.1.2
fabric_loader_version=0.18.6

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.7-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.java.installations.fromEnv=JAVA_HOME
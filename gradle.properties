# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.5.5
group=com.onlytp.onlytpmod
java_version=25

# Common
minecraft_version=26.2
mod_name=Only TP
mod_author=Huziyang520
mod_id=onlytp
license=MIT
credits=
description=Restrict players to TP-related commands only, or block all non-TP commands.
minecraft_version_range=[26.1, 26.3)

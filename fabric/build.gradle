plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        transitive = false
    }
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    modCompileOnly fileTree(project.file('../../../AvalonBase/1.21-1.21.1/fabric/build/libs')) {
        include 'avalonbase-fabric-1.21-1.21.1-1.5.1.jar'
    }

    modImplementation "com.camelot:camelot-fabric-${mc_range_label}:${camelot_version}"
    include "com.camelot:camelot-fabric-${mc_range_label}:${camelot_version}"
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

    compileOnly("com.terraformersmc:modmenu:20.0.1")

    implementation fileTree(project.file("../../../AvalonBase/26.3/fabric/build/libs")) {
        include "avalonbase-fabric-26.3-1.5.1.jar"
        exclude "*-sources.jar"
        exclude "*-javadoc.jar"
    }

    implementation "com.camelot:camelot-fabric-${mc_range_label}:${camelot_version}"
    include "com.camelot:camelot-fabric-${mc_range_label}:${camelot_version}"
}
loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
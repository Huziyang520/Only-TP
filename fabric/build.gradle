plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // AvalonBase 前置支持库：运行时作为 mod 依赖，由 onlytp 的 fabric.mod.json 声明前置
    // 固定文件名：build/libs 永久保留各旧版 jar（铁律不删），通配会把多个版本同时放进 classpath；
    // AvalonBase 升版时必须同步修改此处文件名。
    modImplementation fileTree(project.file("../../../AvalonBase/1.21.9-1.21.11/fabric/build/libs")) {
        include "avalonbase-fabric-1.21.11-1.5.1.jar"
    }
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

    // Mod Menu API: compile-time only so the mod list can show our config button.
    // 本档 loom 为经典模式（mod* 配置可用）：modCompileOnly 会把它 remap 成 named，
    // 且永远不会打进产物 jar。
    modCompileOnly "com.terraformersmc:modmenu:17.0.1"

    // nightconfig（TOML）：Fabric 不自带，需显式引入并打包进 jar
    include implementation("com.electronwill.night-config:core:3.6.4")
    include implementation("com.electronwill.night-config:toml:3.6.4")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

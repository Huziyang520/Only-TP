plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin' version '0.7.+'
}

def refmapName = "${mod_id}.refmap.json"

mixin {
    add sourceSets.main, refmapName
    config "onlytp.forge.mixins.json"
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

configurations {
    camelotEmbed
}

dependencies {
    camelotEmbed("com.camelot:camelot-forge-${mc_range_label}:${camelot_version}@jar") {
        transitive = false
    }

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly project(':common')

    compileOnly fileTree(project.file("../../../AvalonBase/${avalon_range}/fabric/build/devlibs")) {
        include "avalonbase-fabric-${avalon_range}-${avalon_version}-dev.jar"
    }

    compileOnly("com.camelot:camelot-forge-${mc_range_label}:${camelot_version}@jar") {
        transitive = false
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = targetCompatibility = "17"
}

tasks.register('camelotJarJarMetadata') {
    def outFile = layout.buildDirectory.file('jarjar/metadata.json')
    outputs.file(outFile)
    doLast {
        def jarFile = configurations.camelotEmbed.singleFile
        outFile.get().asFile.parentFile.mkdirs()
        outFile.get().asFile.text = """{"jars":[{"identifier":{"group":"com.camelot","artifact":"camelot-forge-${mc_range_label}"},"version":{"range":"[1.0.0,)","artifactVersion":"${camelot_version}"},"path":"META-INF/jarjar/${jarFile.name}","isObfuscated":true}]}"""
    }
}

jar {
    dependsOn 'camelotJarJarMetadata'
    // 混淆环境下 @Inject 的 method 必须靠 refmap 重映射；AP 只把它写进 tmp/compileJava。
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(layout.buildDirectory.dir('tmp/compileJava')) {
        include refmapName
    }
    from({ configurations.camelotEmbed.singleFile }) {
        into 'META-INF/jarjar'
    }
    from(layout.buildDirectory.dir('jarjar')) {
        into 'META-INF/jarjar'
    }
    finalizedBy('reobfJar')
}

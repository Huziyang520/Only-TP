plugins {
    id 'java-library'
    id 'maven-publish'
}

layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)

base {
    archivesName = "${mod_id}-${project.name}-${mc_range_label}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of((findProperty('compile_java_version') ?: java_version) as int)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (findProperty('java_target_version') != null) {
        options.release = java_target_version as int
    }
}

def licenseFile = new File(rootProject.projectDir.parentFile, 'LICENSE')

repositories {

    mavenLocal()

    maven {
        name = 'Aliyun Central'
        url = 'https://maven.aliyun.com/repository/central'
    }
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {

        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {

        name = 'FabricMC'
        url = 'https://maven.fabricmc.net/'
    }
    maven {

        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {

        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

['apiElements', 'runtimeElements'].each { variant ->
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

def targetOverlayProperty = findProperty('target_overlay')
if (targetOverlayProperty) {
    def overlayRoot = rootProject.file(targetOverlayProperty)
    def overlayJava = new File(overlayRoot, "${project.name}/java")
    def overlayResources = new File(overlayRoot, "${project.name}/resources")
    if (overlayJava.directory) {
        def mergedJava = layout.buildDirectory.dir('merged/java')
        def mergeJava = tasks.register('mergeTargetJava', Sync) {
            from('src/main/java')
            from(overlayJava) { include '**/*.java' }
            into mergedJava
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
        sourceSets.main.java.setSrcDirs([mergedJava])
        tasks.named('compileJava') { dependsOn mergeJava }
    }
    if (overlayResources.directory) {
        def mergedResources = layout.buildDirectory.dir('merged/resources')
        def mergeResources = tasks.register('mergeTargetResources', Sync) {
            from('src/main/resources')
            from(overlayResources)
            into mergedResources
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
        sourceSets.main.resources.setSrcDirs([mergedResources])
        processResources { dependsOn mergeResources }
    }
    def mergeTasks = tasks.matching { it.name in ['mergeTargetJava', 'mergeTargetResources'] }
    tasks.configureEach {
        if (name in ['processResources']) {
            dependsOn mergeTasks
        }
    }
}

jar {
    if (licenseFile.exists()) {
        from(licenseFile) {
            rename { "${it}_${mod_name}" }
        }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                   : version,
            'group'                     : project.group,
            'minecraft_version'         : minecraft_version,
            'minecraft_version_range'   : minecraft_version_range,
            'fabric_version'            : fabric_version,
            'fabric_loader_version'     : fabric_loader_version,
            'fabric_mc_dep'             : fabric_mc_dep,
            'mod_name'                  : mod_name,
            'mod_author'                : mod_author,
            'mod_id'                    : mod_id,
            'license'                   : license,
            'description'               : project.description,
            'neoforge_version'          : project.hasProperty('neoforge_version') ? neoforge_version : '',
            'forge_loader_version_range': project.hasProperty('forge_loader_version_range') ? forge_loader_version_range : '',
            'credits'                   : credits,
            'java_version'              : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json', 'neoforge.mod.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
}
